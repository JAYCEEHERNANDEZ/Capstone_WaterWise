name: Sync Deployment Repositories

on:
  push:
    branches:
      - main

jobs:
  sync-frontend:
    if: contains(github.event.head_commit.modified, 'frontend/') || contains(github.event.head_commit.added, 'frontend/') || contains(github.event.head_commit.removed, 'frontend/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Deployed_Frontend
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_REPOS_TOKEN }}@github.com/JAYCEEHERNANDEZ/Deployed_Frontend.git deployed-frontend

      - name: Sync frontend
        run: |
          rsync -av --delete \
            --exclude=".git" \
            frontend/ deployed-frontend/

      - name: Push changes
        working-directory: deployed-frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync frontend from Capstone_WaterWise"
            git push
          fi

  sync-backend:
    if: contains(github.event.head_commit.modified, 'backend/') || contains(github.event.head_commit.added, 'backend/') || contains(github.event.head_commit.removed, 'backend/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Deployed_Backend
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_REPOS_TOKEN }}@github.com/JAYCEEHERNANDEZ/Deployed_Backend.git deployed-backend

      - name: Sync backend
        run: |
          rsync -av --delete \
            --exclude=".git" \
            backend/ deployed-backend/

      - name: Push changes
        working-directory: deployed-backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync backend from Capstone_WaterWise"
            git push
          fi